<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Career Dashboard — Hope</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,-50..200" rel="stylesheet">
<!-- Theme-init stays inline (canonical exception) so the page never flashes the wrong theme. -->
<script>
(function () {
  try {
    var t = localStorage.getItem('hope-portfolio-theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="dashboard.css" />
</head>
<body>
<div class="wrap">

  <!-- HEADER — who, where to, how far. One glance, no reading. -->
  <header class="head reveal">
    <div class="head-id" id="head-id"></div>
    <div class="head-actions">
      <a class="tb-btn" href="index.html" target="_blank" rel="noopener">
        <span class="material-symbols-rounded">badge</span><span>Portfolio</span>
      </a>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme" type="button">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
    </div>
  </header>

  <div class="hero reveal" id="hero"></div>

  <!-- THE TWO PAGES -->
  <nav class="pages reveal" aria-label="Dashboard pages">
    <button class="page-tab active" data-page="gaps" type="button">
      <span class="pt-ic material-symbols-rounded">target</span>
      <span class="pt-body"><span class="pt-label">Skill Gaps</span><span class="pt-sub">close what's between you and the role</span></span>
    </button>
    <button class="page-tab" data-page="jobs" type="button">
      <span class="pt-ic material-symbols-rounded">work</span>
      <span class="pt-body"><span class="pt-label">Jobs</span><span class="pt-sub">find them · apply · track</span></span>
    </button>
  </nav>

  <!-- PAGE 1 · SKILL GAPS — the bridge, actions only -->
  <main class="page active" data-page="gaps">
    <section class="block reveal" id="blk-gaps"></section>
    <section class="block reveal" id="blk-moat"></section>
    <section class="block reveal" id="blk-plan"></section>
    <section class="block reveal" id="blk-build"></section>
  </main>

  <!-- PAGE 2 · JOBS — the board + what to do next -->
  <main class="page" data-page="jobs">
    <section class="block reveal" id="blk-board"></section>
    <section class="block reveal" id="blk-next"></section>
  </main>

  <footer class="footer"><span id="footer-stamp"></span><span class="right"><span class="material-symbols-rounded">favorite</span><span>by <a href="https://github.com/oneconsciousness/job-hunt-with-hope" target="_blank" rel="noopener">Hope</a></span></span></footer>
</div>

<script src="data.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
